name: Build release from committed archive

# בונה ZIP מהארכיון שנמצא כבר בריפו (kolzchut_out/ דרך Git LFS).
# לא נדרשת גישה ל-API של כל-זכות מהענן — עובד גם כש-GitHub נחסם.

on:
  workflow_dispatch: {}        # כפתור הרצה ידני

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repo (with LFS)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Build portal (with GitHub repo for update-check)
        run: python kolzchut_build_portal.py --github-repo Lev-Good/KolZchut-offline

      - name: Build release ZIP + manifest
        id: release
        run: |
          python kolzchut_release.py
          DATE=$(date -u +%Y%m%d%H%M)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.date }}
          files: releases/kolzchut_*.zip
          body: |
            עדכון ארכיון כל זכות האופלייני.
            הורידו את ה-ZIP, פתחו, והחליפו תיקייה קיימת (או פתחו בתיקייה חדשה).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
