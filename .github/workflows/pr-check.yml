name: PR — verify archive integrity

# מודל האמון (דרישת אבטחה: אין להריץ קוד לא מהימן עם הרשאות כתיבה למאגר;
# יש להפריד בין בדיקת התוכן שהוגש לבין שלב המיזוג והפרסום המורשה):
#   - כל סקריפטי האימות (kolzchut_verify.py, kolzchut_remove_content.py)
#     נלקחים מ-BASE (master) בלבד — לעולם לא מה-PR.
#     PR תורם *נתוני ארכיון* בלבד, לא קוד.
#   - ל-job הזה אין הרשאות כתיבה (contents: read). התוכן הנבדק נקרא, לא מורץ.
#
# שים לב: עבור אירועי pull_request, GitHub מריץ את קובץ ה-workflow **מה-PR**.
# לכן ה-job הזה הוא משוב מהיר בלבד; הבקרה הקובעת היא auto-merge.yml שרץ
# מ-branch ברירת המחדל (workflow_run) ומסרב למזג כל PR שנוגע במשהו מחוץ ל-
# kolzchut_out/** ו-docs/** — כך שאי אפשר גם לשנות את השער וגם להיכנס דרכו.
#
# ה-job חייב לעבוד גם עם הסקריפטים של master וגם עם אלה שאחרי המיזוג, ולכן
# הוא משתמש רק בממשק קיים (נתיבי ברירת מחדל, --baseline <ref>) ואינו תלוי
# בקבצים שקיימים רק ב-PR.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: kolzchut-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out base branch (trusted verification scripts only)
        uses: actions/checkout@v4
        with:
          ref: master
          lfs: false
          fetch-depth: 1

      - name: Fetch origin/master (baseline source)
        run: git fetch origin master --depth=1

      - name: Check out PR archive content (untrusted data, never executed)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-archive
          lfs: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        # Packages listed explicitly on purpose: this step runs against the base
        # branch checkout, so it must not depend on a file that only exists in
        # the PR (that is what broke the very first run of this pipeline).
        run: pip install requests beautifulsoup4

      - name: Materialize the master baseline index (Git LFS)
        run: |
          # kolzchut_out/** is stored in Git LFS, so `git show` alone returns a
          # pointer and a naive baseline compare would silently disable the
          # anomalous-size check. Fetch just this object (an explicit failure
          # here is the alarm) and prove it smudges to real JSON.
          git lfs fetch --include="kolzchut_out/index.json" origin master
          git show origin/master:kolzchut_out/index.json > kolzchut_baseline.pointer
          git lfs smudge < kolzchut_baseline.pointer > kolzchut_baseline_index.json
          python -c "import json; d = json.load(open('kolzchut_baseline_index.json', encoding='utf-8')); print(f'baseline pages: {len(d)}')"

      - name: Stage the submitted archive as data (default archive path)
        run: |
          rsync -a --delete pr-archive/kolzchut_out/ kolzchut_out/
          echo "staged pages: $(ls kolzchut_out/pages | wc -l)"

      - name: Verify archive integrity (trusted verifier + master baseline)
        run: |
          # Script from master, content from the PR, size baseline from master.
          # kolzchut_verify.py resolves the LFS pointer itself (and must fail
          # loudly when a requested baseline is unreadable).
          python kolzchut_verify.py \
            --out kolzchut_out \
            --baseline origin/master \
            --allow-shrink 200 \
            --allow-grow 2000

      - name: Enforce the content filter on the GitHub side (must be a no-op)
        run: |
          # The real filter (not a sample) runs here, on the GitHub side, before
          # any merge. A submitted archive that was not filtered locally changes
          # under it and fails the PR. Deterministic and config-independent.
          python kolzchut_remove_content.py --default-charedi-list
          python - <<'PY'
          import filecmp
          import json
          import sys
          from pathlib import Path

          submitted = Path("pr-archive/kolzchut_out")
          filtered = Path("kolzchut_out")

          sub_pages = {p.name for p in (submitted / "pages").glob("*.html")}
          flt_pages = {p.name for p in (filtered / "pages").glob("*.html")}

          removed = sorted(sub_pages - flt_pages)
          changed = sorted(n for n in sorted(sub_pages & flt_pages)
                           if not filecmp.cmp(submitted / "pages" / n,
                                              filtered / "pages" / n,
                                              shallow=False))

          try:
              sub_idx = json.loads((submitted / "index.json").read_text(encoding="utf-8"))
              flt_idx = json.loads((filtered / "index.json").read_text(encoding="utf-8"))
          except (OSError, ValueError) as exc:
              print(f"FILTER CHECK: index.json unreadable: {exc}", file=sys.stderr)
              sys.exit(1)

          problems = []
          if removed:
              problems.append(f"{len(removed)} page(s) the filter would remove: {removed[:5]}")
          if changed:
              problems.append(f"{len(changed)} page(s) the filter would modify: {changed[:5]}")
          if sub_idx != flt_idx:
              problems.append("index.json differs after re-running the filter "
                              f"(submitted {len(sub_idx)} entries vs filtered {len(flt_idx)})")

          if problems:
              print("CONTENT FILTER NOT APPLIED by the submitter:", file=sys.stderr)
              for p in problems:
                  print(f"  - {p}", file=sys.stderr)
              sys.exit(1)

          print(f"content filter is a no-op on all {len(sub_pages)} pages "
                f"— filtering was applied before submission")
          PY

      - name: Verify deletions and sync failures (delta.json)
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          delta = Path("kolzchut_out/delta.json")
          if not delta.exists():
              print("no delta.json — nothing to validate")
              sys.exit(0)

          d = json.loads(delta.read_text(encoding="utf-8"))
          deleted = d.get("deleted", [])
          failed = d.get("counts", {}).get("failed", 0)

          if failed > 0:
              print(f"SYNC ERRORS REPORTED: {failed} pages failed — merging blocked",
                    file=sys.stderr)
              sys.exit(1)

          idx = json.loads(Path("kolzchut_out/index.json").read_text(encoding="utf-8"))
          n = len(idx)
          pct = len(deleted) / max(n, 1) * 100
          if pct > 1.0:
              print(f"ANOMALOUS DELETION: {len(deleted)} pages deleted ({pct:.1f}%) "
                    f"— merging blocked", file=sys.stderr)
              sys.exit(1)

          print(f"deletion check ok — {len(deleted)} deletions ({pct:.2f}%), "
                f"sync failures=0")
          PY

      - name: Publish the verification report to the job summary
        if: always()
        run: |
          python kolzchut_verify.py --out kolzchut_out --baseline origin/master \
            > kolzchut_report.json || true
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = Path("kolzchut_report.json")
          try:
              text = report.read_text(encoding="utf-8")
              start, end = text.find("{"), text.rfind("}")
              data = json.loads(text[start:end + 1]) if start >= 0 else {}
          except (OSError, ValueError) as exc:
              print(f"(verification report unavailable: {exc})")
              raise SystemExit(0)

          lines = [f"## KolZchut PR verification — {data.get('total_errors', '?')} error(s)", ""]
          for name, res in (data.get("checks") or {}).items():
              errs = res.get("errors") or []
              mark = "OK" if not errs else "FAIL"
              detail = ""
              if name == "internal_links":
                  detail = (f" — broken {res.get('broken')}/{res.get('checked')} "
                            f"({res.get('broken_ratio')}); informational, not blocking")
              if name == "size_delta_vs_baseline" and "delta" in res:
                  detail = (f" — baseline {res.get('baseline_pages')} → "
                            f"{res.get('new_pages')} ({res.get('delta'):+d} pages)")
              lines.append(f"- **{name}**: {mark}{detail}")
              for e in errs[:3]:
                  lines.append(f"  - {e}")
          lines.append("")
          lines.append("Filter and deletion guards ran in their own steps; a non-zero "
                       "exit there blocks the merge.")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          text = "\n".join(lines) + "\n"
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(text)
          print(text)
          PY
