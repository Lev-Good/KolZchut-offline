name: KolZchut cloud access probe

# בדיקת ניסיון בלבד: הרצה ידנית. לא משנה קבצים ולא מפרסם ריליז.
# בודק גישה מותרת (robots.txt): sitemap.gz + דף מאמר ציבורי, עם UA מזוהה.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: kolzchut-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install requests

      - name: Probe sitemap + article (documented HTTP evidence)
        run: |
          python - <<'PY'
          import gzip, re, time
          import urllib.request
          import urllib.error

          SITE = "https://www.kolzchut.org.il"
          SITEMAP = SITE + "/sitemap/sitemap-kz_he-NS_0-0.xml.gz"
          ARTICLE = SITE + "/he/%D7%A4%D7%A8%D7%99%D7%A9%D7%94_%D7%9C%D7%A4%D7%A0%D7%A1%D7%99%D7%94"  # "פרישה לפנסיה"
          # UA מזוהה — לפי מדיניות robots.txt של האתר, ללא עקיפת חסימות
          UA = ("KolZchutOfflineArchive/1.0 "
                "(GitHub Actions, personal non-commercial use; CC-BY-NC-SA-2.5-IL) "
                "+https://github.com/Lev-Good/KolZchut-offline")
          HDRS = {"User-Agent": UA, "Accept-Encoding": "gzip"}

          results = []

          def get(name, url, timeout=60):
              t0 = time.time()
              status = ctype = None
              size = None
              err = None
              try:
                  req = urllib.request.Request(url, headers=HDRS)
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      status = r.status
                      ctype = r.headers.get("Content-Type")
                      body = r.read()
                      size = len(body)
                      if ctype and "gzip" in (ctype or "") or url.endswith(".gz"):
                          try:
                              body = gzip.decompress(body)
                              size = len(body)
                          except Exception:
                              pass
              except urllib.error.HTTPError as e:
                  status = e.code
                  ctype = e.headers.get("Content-Type")
                  try:
                      size = len(e.read() or b"")
                  except Exception:
                      size = None
                  err = f"HTTPError {e.code}"
              except Exception as e:
                  err = f"{type(e).__name__}: {e}"
              dt = time.time() - t0
              print(f"[{name}] status={status} content_type={ctype} "
                    f"decoded_size={size} seconds={dt:.2f} error={err}")
              results.append((name, status, ctype, size, err))
              return body if err is None and status == 200 else None

          # 1) sitemap עם כיבוד Crawl-delay: 5 בין בקשות לדומיינים אלו
          sm = get("sitemap", SITEMAP)
          time.sleep(5)
          # 2) דף מאמר ציבורי יחיד (מותר ב-robots.txt)
          art = get("article", ARTICLE)

          # sanity: sitemap must contain many <loc> and the article must contain content div
          if sm:
              n = sm.decode("utf-8", errors="replace").count("<url>")
              print(f"[sitemap] parsed <url> entries = {n}")
          if art:
              ok = "mw-parser-output" in art.decode("utf-8", errors="replace")
              print(f"[article] contains mw-parser-output: {ok}")

          print("\n=== PROBE SUMMARY ===")
          for name, status, ctype, size, err in results:
              print(f"{name:10s} status={status} type={ctype} size={size} err={err}")
          if all(r[1] == 200 for r in results):
              print("PROBE OUTCOME: OK — cloud sync is feasible")
          else:
              print("PROBE OUTCOME: BLOCKED/FAILED — cloud sync NOT confirmed")
          PY
