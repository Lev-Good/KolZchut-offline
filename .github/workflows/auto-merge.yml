name: Auto-merge verified archive PR

# ממזג PR תוכן-ארכיון שכל הבדיקות בו עברו, ומפעיל את בניית ה-Release.
#
# למה workflow_run ולא polling על status checks: ה-check runs של ה-workflow הזה
# עצמו מופיעים ב-statusCheckRollup של ה-PR, ולכן "כל הבדיקות ירוקות" לא יכול
# היה להתקיים אף פעם — המיזוג האוטומטי נתקע (fail + request-changes).
# כאן ה-workflow מתעורר ברגע ש-workflow הבדיקות מסתיים בהצלחה.
#
# הגנת אמון: אוטו-מיזוג חל על *שינויי תוכן בלבד* (kolzchut_out/**, docs/**).
# PR שנוגע בסקריפטי האימות או ב-workflows לא ממוזג אוטומטית — אחרת אפשר היה
# להחליף את סקריפט האימות ב-master ולעקוף את כל השער בפעם הבאה.

on:
  workflow_run:
    workflows: ["PR — verify archive integrity"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  actions: write         # gh workflow run — הפעלת בניית ה-Release
  contents: write        # מיזוג ל-master
  pull-requests: write   # תגובות ומיזוג PR

concurrency:
  group: kolzchut-auto-merge
  cancel-in-progress: false

jobs:
  merge-if-verify-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve the candidate PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            BRANCH="${{ github.event.workflow_run.head_branch }}"
            if [ "$CONCLUSION" != "success" ]; then
              echo "verify run concluded '$CONCLUSION' — not merging."
              exit 0
            fi
            PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --label auto-merge-candidate \
                   --head "$BRANCH" --state open --json number --jq '.[0].number // ""')
          else
            PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --label auto-merge-candidate \
                   --state open --json number --jq '.[0].number // ""')
          fi
          if [ -z "$PR" ]; then
            echo "No open auto-merge-candidate PR — nothing to do."
            exit 0
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "resolved PR #$PR"

      - name: Guard — only content-only PRs auto-merge
        id: guard
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR="${{ steps.pr.outputs.number }}"
          FILES=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
          OUTSIDE=$(printf '%s\n' "$FILES" | grep -v -E '^(kolzchut_out/|docs/)' || true)
          if [ -n "$OUTSIDE" ]; then
            echo "::notice::PR #$PR touches verification/workflow files — auto-merge skipped by design."
            printf '%s\n' "$OUTSIDE" | head -20
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "ℹ️ אוטו-מיזוג דולג: ה-PR נוגע גם בקבצים שאינם תוכן ארכיון (סקריפטי אימות / workflows / קוד). שינויי תשתית מחייבים מיזוג אנושי — כדי שלא ניתן יהיה להחליף את מנגנון הבדיקה דרך PR. הבדיקות עצמן עברו; המיזוג ממתין לתחזוקן."
            exit 0
          fi
          echo "ok=1" >> "$GITHUB_OUTPUT"
          echo "PR #$PR is content-only — eligible for auto-merge."

      - name: Merge (squash) unless master moved
        if: steps.guard.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR="${{ steps.pr.outputs.number }}"
          STATE=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
                    --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$STATE" = "DIRTY" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⚠️ master התקדם מאז תחילת הסנכרון — קונפליקט מיזוג. הריצו שוב את kolzchut_contribute.py: הסנכרון ייגזר מחדש מ-master המעודכן. הגרסה המאומתת הקודמת נשארת באוויר."
            echo "merge conflict -> NOT merging PR #$PR"
            exit 1
          fi
          if ! gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash \
                 --delete-branch --subject "Auto-merged archive update"; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⚠️ המיזוג האוטומטי נחסם (הענף אינו מעודכן מול master או בדיקה חסרה). הגרסה המאומתת הקודמת נשארת באוויר."
            exit 1
          fi
          echo "merged PR #$PR"

      - name: Trigger the release build
        if: steps.guard.outputs.ok == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR="${{ steps.pr.outputs.number }}"
          sleep 20   # give master a moment to settle
          for attempt in 1 2 3; do
            if gh workflow run "Build release from committed archive" \
                 --repo "$GITHUB_REPOSITORY" --ref master; then
              echo "release build dispatched"
              exit 0
            fi
            echo "dispatch attempt $attempt failed — retrying"
            sleep 15
          done
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "⚠️ המיזוג הצליח, אך הפעלת בניית ה-Release נכשלה. הריצו ידנית: Actions → Build release from committed archive."
          exit 1

  on-failure-report:
    runs-on: ubuntu-latest
    needs: merge-if-verify-passed
    if: failure()
    steps:
      - name: Report the failure on the candidate PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" \
                 --label auto-merge-candidate --state open \
                 --json number --jq '.[0].number // ""')
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "❌ האוטו-מיזוג לא הושלם — הגרסה המאומתת האחרונה נשארת באוויר. ראו את הלוג של הריצה."
          fi
