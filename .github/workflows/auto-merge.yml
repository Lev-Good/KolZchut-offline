name: Auto-merge verified archive PR

# מסנכרן PRs שסומנו auto-merge-candidate וכל הבדיקות בהם עברו.
# בהצלחה — מיזוג ל-master + הפעלת Build Release. בכישלון — נותרת
# גרסת העדכון האחרונה במקומה; מופק דוח שגיאות על ה-PR.

on:
  pull_request:
    types: [labeled, synchronize]
    branches: [master]
  check_suite:
    types: [completed]
  workflow_dispatch: {}
  status: {}

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: kolzchut-auto-merge
  cancel-in-progress: false

jobs:
  merge-if-verify-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request != null &&
       contains(github.event.pull_request.labels.*.name, 'auto-merge-candidate'))
    steps:
      - name: Checkout master (trusted scripts only)
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Find qualifying PR
        id: find_pr
        run: |
          # Look up the label; if no PR qualifies, skip silently.
          PR=$(gh pr list --repo "${{ github.repository }}" \
                     --label auto-merge-candidate \
                     --state open \
                     --json number --jq '.[0].number // ""')
          if [ -z "$PR" ]; then
            echo "No open auto-merge-candidate PR — nothing to do."
            exit 0
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          # Prefilter: is the latest commit already verified?
          gh pr view "$PR" --repo "${{ github.repository }}" \
             --json mergeable,mergeStateStatus,statusCheckRollup \
             --jq '{mergeable, mergeStateStatus, checks: [.statusCheckRollup[].status]}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for the PR verify check to be green
        if: steps.find_pr.outputs.pr != ''
        run: |
          PR=${{ steps.find_pr.outputs.pr }}
          for i in $(seq 1 30); do
            if gh pr view "$PR" --repo "${{ github.repository }}" \
               --json statusCheckRollup \
               --jq '[.statusCheckRollup[] | select(.conclusion != null)] | length > 0' \
               | grep -q "false"; then
              echo "checks still pending — retry in 20s"
              sleep 20
              continue
            fi
            if gh pr view "$PR" --repo "${{ github.repository }}" \
               --json statusCheckRollup \
               --jq '[.statusCheckRollup[] | select(.conclusion != "SUCCESS")] | length == 0'; then
              echo "all checks green"
              exit 0
            else
              echo "some checks failing — $PR will NOT be merged automatically"
              gh pr review "$PR" --repo "${{ github.repository }}" --request-changes \
                 --body "❌ CI checks failed — auto-merge skipped. See the failing checks for the error report."
              exit 1
            fi
          done
          echo "timed out waiting for checks — leaving PR open"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge PR (squash)
        if: steps.find_pr.outputs.pr != ''
        run: |
          PR=${{ steps.find_pr.outputs.pr }}
          # Guard against a master that changed after the PR started:
          # if the merge state is "dirty" (conflict) fail and report instead of force-merging.
          MERGE_STATE=$(gh pr view "$PR" --repo "${{ github.repository }}" \
                          --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$MERGE_STATE" = "DIRTY" ]; then
            gh pr comment "$PR" --repo "${{ github.repository }}" \
               --body "⚠️ master moved since this PR started — merge conflict detected."
            gh pr review "$PR" --repo "${{ github.repository }}" --request-changes \
               --body "master moved since sync start — please rebase and resubmit (kolzchut_contribute.py will re-diff from the new master)."
            echo "merge conflict -> NOT merging PR $PR"
            exit 1
          fi
          # NOTE: --auto requires 'Allow auto-merge' in repo settings; skip that
          # flag and merge directly once checks are verified green above.
          gh pr merge "$PR" --repo "${{ github.repository }}" --squash \
             --delete-branch --subject "Auto-merged archive update"
          echo "merged PR $PR"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger the Release workflow (builds a ZIP from the merged master)
        if: steps.find_pr.outputs.pr != ''
        run: |
          sleep 30   # allow time for master to settle
          gh workflow run "Build release from committed archive" \
             --repo "${{ github.repository }}" --ref master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  on-failure-report:
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Report failure on the last qualifying PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list --repo "${{ github.repository }}" \
                     --label auto-merge-candidate \
                     --state open \
                     --json number --jq '.[0].number // ""')
          if [ -n "$PR" ]; then
            gh pr comment "$PR" --repo "${{ github.repository }}" \
               --body "❌ Auto-merge failed — the previous verified archive remains published. See the run log for details."
          fi
